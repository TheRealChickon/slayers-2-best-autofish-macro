<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autofish</title>
<style>
/*FONTS*/
/* Same design language as Rod Lab: neutral surfaces, one accent, rarity hues for data only. */
:root{
  --bg:#f7f7f5; --surface:#ffffff; --raised:#fbfbfa; --border:#e6e5e1; --border-strong:#d4d3ce;
  --text-1:#111110; --text-2:#55544f; --text-3:#8a8983;
  --accent:#2a78d6; --accent-soft:#e8f0fb;
  --common:#8d8c86; --uncommon:#2a78d6; --legendary:#eda100; --rare:#0f9fb5; --mythic:#9b4fe0; --impossible:#e5336b;
  --good:#0ca30c; --warn:#c98500; --bad:#d23f31; --idle:#8a8983;
  --shadow:0 1px 2px rgba(17,17,16,.04),0 1px 1px rgba(17,17,16,.03);
  --sans:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,'SFMono-Regular',Consolas,monospace;
  --r:18px; --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1); --squish:cubic-bezier(.5,1.8,.4,.8);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f0f0e; --surface:#171716; --raised:#1c1c1b; --border:#2a2a28; --border-strong:#383835;
  --text-1:#f2f2ef; --text-2:#b4b3ac; --text-3:#7d7c76;
  --accent:#3987e5; --accent-soft:#1a2738;
  --common:#9c9b95; --uncommon:#3987e5; --legendary:#d69a12; --rare:#22b5c9; --mythic:#b47cf2; --impossible:#ff5a8a; --bad:#e5594b;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f0f0e; --surface:#171716; --raised:#1c1c1b; --border:#2a2a28; --border-strong:#383835;
  --text-1:#f2f2ef; --text-2:#b4b3ac; --text-3:#7d7c76;
  --accent:#3987e5; --accent-soft:#1a2738;
  --common:#9c9b95; --uncommon:#3987e5; --legendary:#d69a12; --rare:#22b5c9; --mythic:#b47cf2; --impossible:#ff5a8a; --bad:#e5594b;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text-1);font:14px/1.5 var(--sans);margin:0;-webkit-font-smoothing:antialiased}
.page{max-width:1200px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:16px}
@media (min-width:720px){.page{padding-inline:28px}}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:32px;height:32px;border-radius:8px;background:var(--text-1);display:grid;place-items:center;flex:none}
.mark svg{width:18px;height:18px}
.brand h1{font:600 18px/1.2 var(--sans);margin:0;letter-spacing:-.01em}
.brand p{margin:0;color:var(--text-3);font-size:12.5px}
.seg{display:inline-flex;background:var(--raised);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{font:500 13px var(--sans);color:var(--text-2);background:transparent;border:0;border-radius:6px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:color .15s,background-color .15s}
.seg button:hover{color:var(--text-1)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text-1);box-shadow:var(--shadow),0 0 0 1px var(--border)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.seg svg{width:14px;height:14px}

/* hero */
.card.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;padding:20px 22px}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.state{display:flex;align-items:center;gap:16px;min-width:0}
.orb{position:relative;width:44px;height:44px;flex:none;display:grid;place-items:center}
.orb i{width:14px;height:14px;border-radius:50%;background:var(--tone);position:relative;z-index:1;transition:background-color .3s}
.orb::before,.orb::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--tone);opacity:0}
.on .orb::before{animation:ping 2.4s var(--ease) infinite}
.on .orb::after{animation:ping 2.4s var(--ease) 1.2s infinite}
@keyframes ping{0%{transform:scale(.32);opacity:.35}100%{transform:scale(1);opacity:0}}
.state h2{font:600 26px/1.15 var(--sans);letter-spacing:-.02em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state p{margin:3px 0 0;color:var(--text-2);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 10px}
.state p span+span::before{content:'·';margin-right:10px;color:var(--text-3)}
.reason{margin-top:8px;font-size:12.5px;color:var(--warn);display:none}
.reason.show{display:block}
.ctl{display:grid;gap:10px;justify-items:end}
@media (max-width:820px){.ctl{justify-items:start}}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:9px 16px;font:500 13.5px var(--sans);cursor:pointer;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-1);transition:transform .12s,background-color .15s,border-color .15s,opacity .15s}
.btn:hover{border-color:var(--text-3)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--text-1);border-color:var(--text-1);color:var(--bg)}
.btn.primary:hover{opacity:.88}
.btn.danger{color:var(--bad)}
.btn svg{width:15px;height:15px}
.btn[hidden]{display:none}
.btn.busy{opacity:.6;pointer-events:none}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);padding:16px 18px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--text-2)}
.kpi .v{font:600 28px/1.15 var(--sans);letter-spacing:-.02em;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v small{font-size:14px;font-weight:500;color:var(--text-3);letter-spacing:0;margin-left:3px}
.kpi .d{font-size:12px;color:var(--text-3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:4px;border-radius:2px;background:var(--border);margin-top:10px;overflow:hidden}
.meter b{display:block;height:100%;border-radius:2px;background:var(--accent);transition:width .8s var(--ease)}
.meter b.low{background:var(--warn)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column}
.card>header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 18px 0}
.card h3{font:600 14px/1.3 var(--sans);margin:0}
.card .cap{margin:2px 0 0;font-size:12.5px;color:var(--text-3)}
.card .body{padding:14px 18px 18px;flex:1;min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}

/* catch bars */
.rows{display:grid;gap:11px}
.row{display:grid;grid-template-columns:104px minmax(0,1fr) 72px;align-items:center;gap:12px}
.row .name{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .val{font:500 13px var(--mono);text-align:right}
.row .val small{color:var(--text-3);font-weight:400}
.track{height:18px;border-radius:4px;background:color-mix(in srgb,var(--text-1) 4%,transparent);overflow:hidden}
.fill{height:100%;border-radius:4px;transform-origin:left;transition:width .8s var(--ease);animation:grow .9s var(--ease) both}
@keyframes grow{from{transform:scaleX(.02);opacity:.4}to{transform:none;opacity:1}}
.empty{color:var(--text-3);font-size:13px;padding:18px 0;text-align:center}

/* activity */
.feed{display:grid;gap:0;max-height:318px;overflow:auto;margin:0 -18px;padding:0 18px;scrollbar-width:thin}
.feed.tall{max-height:none}
.ev{display:grid;grid-template-columns:52px 10px minmax(0,1fr);gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.ev:last-child{border-bottom:0}
.ev time{font:400 12px var(--mono);color:var(--text-3)}
.ev i{width:7px;height:7px;border-radius:50%;background:var(--idle);align-self:center}
.ev.catch i{background:var(--common)} .ev.item i{background:var(--legendary)} .ev.warn i{background:var(--warn)}
.ev.error i{background:var(--bad)} .ev.state i{background:var(--accent)}
.ev span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.fresh{animation:fresh .6s var(--ease)}
@keyframes fresh{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* checks strip */
.checks{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 11px;border:1px solid var(--border);border-radius:999px;background:var(--raised);font-size:12.5px;color:var(--text-2)}
.pill b{font-weight:500;color:var(--text-1)}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--idle)}
.pill.ok i{background:var(--good)} .pill.warn i{background:var(--warn)} .pill.bad i{background:var(--bad)}

/* tables */
.tbl{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
th:last-child,td:last-child{padding-right:0}
thead th{font:500 11.5px var(--sans);color:var(--text-3);border-bottom:1px solid var(--border-strong)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--text-1) 2.5%,transparent)}
.chip{display:inline-flex;align-items:center;gap:7px}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--idle)}

/* settings */
.form{display:grid;gap:0}
.set{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}
.set:last-child{border-bottom:0}
.set .t{font-weight:500;font-size:13.5px}
.set .h{font-size:12.5px;color:var(--text-3);margin-top:1px}
.input{font:400 13.5px var(--sans);color:var(--text-1);background:var(--raised);border:1px solid var(--border-strong);border-radius:8px;padding:8px 11px;width:220px;max-width:100%;transition:border-color .15s}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.switch{position:relative;width:38px;height:22px;flex:none;border-radius:999px;border:0;background:var(--border-strong);cursor:pointer;transition:background-color .2s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .22s var(--ease)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(16px)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden}
.stepper button{border:0;background:var(--raised);width:32px;height:34px;cursor:pointer;font:500 15px var(--sans)}
.stepper button:hover{background:var(--border)}
.stepper output{min-width:40px;text-align:center;font:500 14px var(--mono)}

/* views */
.view{display:none;gap:16px}
.view.on{display:grid;animation:in .35s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.lab{width:calc(100% + 32px);margin:-12px -16px 0;height:calc(100vh - 110px);min-height:560px;border:0;background:transparent}
@media (min-width:720px){.lab{width:calc(100% + 56px);margin-inline:-28px}}

/* onboarding */
.veil{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:16px;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(6px)}
.veil.on{display:grid;animation:in .3s var(--ease)}
.sheet{width:min(560px,100%);background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 24px 64px rgba(0,0,0,.14);padding:26px}
.sheet h2{font:600 20px/1.25 var(--sans);letter-spacing:-.01em;margin:14px 0 6px}
.sheet p{margin:0;color:var(--text-2);font-size:13.5px}
.step{font:500 12px var(--mono);color:var(--text-3)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
@media (max-width:520px){.choices{grid-template-columns:1fr}}
.choice{display:grid;gap:4px;align-content:start;text-align:left;padding:14px;border:1px solid var(--border-strong);border-radius:10px;background:var(--raised);cursor:pointer;transition:border-color .15s,background-color .15s,transform .12s}
.choice:hover{border-color:var(--accent);background:var(--accent-soft)}
.choice:active{transform:scale(.98)}
.choice b{font:600 14px var(--sans)}
.choice span{font-size:12.5px;color:var(--text-2)}
.sheet .input{width:100%;margin-top:16px}
.sheet .btns{margin-top:16px;justify-content:flex-end}

.toast{position:fixed;left:50%;bottom:22px;z-index:30;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:var(--text-1);color:var(--bg);font:500 13px var(--sans);padding:9px 14px;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.2);transition:opacity .2s,transform .2s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{color:var(--text-3);font-size:12px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
footer a{color:inherit}

/* icons */
.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.i.big{width:34px;height:34px;stroke-width:1.4;color:var(--border-strong)}
.mark .i{width:18px;height:18px;stroke-width:2}
.tabs button{padding:6px 11px}
.tabs button[aria-label]{padding:6px 9px}
.card>header h3{display:flex;align-items:center;gap:8px}
.card>header h3 .i{color:var(--text-3)}
.count{font:500 12px var(--mono);color:var(--text-3);background:var(--raised);border:1px solid var(--border);border-radius:999px;padding:0 8px}
.hint{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--good)}
.hint .i{width:14px;height:14px;stroke-width:2.2}
.state p span{display:inline-flex;align-items:center;gap:6px}
.state p .i{width:14px;height:14px;color:var(--text-3)}
.reason .i{width:14px;height:14px;margin-right:6px}
.hero .checks{grid-column:1/-1;border-top:1px solid var(--border);padding-top:14px;margin-top:2px}
.pill .i{width:14px;height:14px;color:var(--text-3)}
.pill.ok .i{color:var(--good)} .pill.warn .i{color:var(--warn)} .pill.bad .i{color:var(--bad)}
.pill.ok,.pill.warn,.pill.bad{color:var(--text-1)}
.kpi .l{display:flex;align-items:center;gap:7px}
.kpi .l .i{color:var(--text-3)}
.ev{grid-template-columns:44px 16px minmax(0,1fr)}
.ev .i{width:14px;height:14px;color:var(--idle);align-self:center}
.ev.catch .i{color:var(--common)} .ev.item .i{color:var(--legendary);fill:color-mix(in srgb,var(--legendary) 25%,transparent)} .ev.warn .i{color:var(--warn)}
.ev.error .i{color:var(--bad)} .ev.state .i{color:var(--accent);fill:currentColor} .ev.rec .i{color:var(--accent)}
.empty .i{display:block;margin:6px auto}
.set{grid-template-columns:34px minmax(0,1fr) auto;gap:12px;cursor:default}
.set .ic{width:34px;height:34px;border-radius:9px;background:var(--raised);border:1px solid var(--border);display:grid;place-items:center;color:var(--text-2)}
.set .t small{display:block;font-size:11.5px;color:var(--text-3);font-weight:400}
.btn.sm{padding:7px 12px;font-size:13px}
.share{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end;width:100%}
.share b{display:block;height:6px;border-radius:3px;background:var(--accent);opacity:.8;max-width:120px;min-width:2px}
.share em{font-style:normal;min-width:44px;text-align:right;font-size:12.5px}
.sheet{text-align:center;padding:28px}
.sheet .badge{width:52px;height:52px;margin:14px auto 0;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.sheet .badge .i{width:26px;height:26px;stroke-width:1.7}
.sheet p{display:inline-flex;align-items:center;gap:6px;color:var(--good);font-size:12.5px}
.sheet p .i{width:14px;height:14px;stroke-width:2.2}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:22px;height:4px;border-radius:2px;background:var(--border-strong)}
.dots i.on{background:var(--accent)}
.choice{justify-items:center;text-align:center;padding:18px 14px}
.choice .i{width:24px;height:24px;color:var(--accent);margin-bottom:4px}
.sheet .btns{justify-content:center}

/* motion: springy, a little bouncy, never slow */
.seg{position:relative;isolation:isolate}
.seg .glide{position:absolute;z-index:-1;border-radius:6px;background:var(--surface);box-shadow:var(--shadow),0 0 0 1px var(--border);pointer-events:none;transition:left .5s var(--spring),top .5s var(--spring),width .5s var(--spring),height .5s var(--spring),opacity .2s}
.seg .glide.now{transition:none}
.seg:has(.glide) button[aria-pressed="true"]{background:transparent;box-shadow:none}
.seg button{transition:color .15s,transform .35s var(--spring)}
.seg button:active:not(:disabled){transform:scale(.9)}
.seg button .i{transition:transform .45s var(--spring)}
.seg button:hover:not(:disabled) .i{transform:translateY(-1px) rotate(-8deg) scale(1.12)}
.seg button[aria-pressed="true"] .i{color:var(--accent)}
.btn{transition:transform .4s var(--spring),box-shadow .25s,background-color .15s,border-color .15s,opacity .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(17,17,16,.08)}
.btn:active{transform:translateY(0) scale(.93);transition-duration:.12s}
.btn .i{transition:transform .45s var(--spring)}
.btn:hover .i{transform:scale(1.18)}
.btn.primary{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--text-1) 0%,transparent)}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--text-1) 8%,transparent)}}
.switch{transition:background-color .25s}
.switch::after{transition:transform .45s var(--spring),width .25s var(--ease)}
.switch:active::after{width:22px}
.switch[aria-checked="true"]:active::after{transform:translateX(10px)}
.kpi{transition:background-color .2s}
.kpi .l .i{transition:transform .5s var(--spring)}
.kpi:hover .l .i{transform:scale(1.25) rotate(-10deg);color:var(--accent)}
.pill{transition:transform .4s var(--spring),border-color .2s}
.pill:hover{transform:translateY(-2px) scale(1.04);border-color:var(--border-strong)}
.card{transition:transform .45s var(--spring),box-shadow .3s}
.grid>.card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(17,17,16,.06)}
.set .ic{transition:transform .45s var(--spring),color .2s,background-color .2s}
.set:hover .ic{transform:scale(1.12) rotate(-6deg);color:var(--accent);background:var(--accent-soft)}
.choice{transition:transform .45s var(--spring),border-color .15s,background-color .15s}
.choice:hover{transform:translateY(-3px) scale(1.02)}
.choice:active{transform:scale(.96);transition-duration:.1s}
.choice .i{transition:transform .5s var(--spring)}
.choice:hover .i{transform:scale(1.25)}
.stepper output.bump{animation:bump .4s var(--spring)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}
.view.on>*{animation:rise .6s var(--spring) backwards}
.view.on>*:nth-child(2){animation-delay:.05s}.view.on>*:nth-child(3){animation-delay:.1s}.view.on>*:nth-child(4){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.view.on{animation:none}
.ev.fresh{animation:pop .55s var(--spring)}
@keyframes pop{from{opacity:0;transform:translateX(-10px) scale(.97)}to{opacity:1;transform:none}}
.toast{transition:opacity .2s,transform .45s var(--spring)}

/* deck */

.mc{position:relative;border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:14px;cursor:pointer;text-align:left;font:inherit;color:inherit;
  display:flex;flex-direction:column;gap:8px;transition:transform .5s var(--spring),box-shadow .3s,border-color .25s,opacity .3s,background-color .3s}

/* 1 · row: four cards across the hero */

.kpi .spark{position:absolute;right:18px;top:38px;width:42%;max-width:150px;height:40px;overflow:visible;pointer-events:none}
.kpi .spark path.ln{fill:none;stroke:var(--sc);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.kpi .spark path.ar{fill:url(#g-sp-pace);opacity:.9}
.kpi .spark circle{fill:var(--sc)}
.kpi .spark .ln{stroke-dasharray:600;stroke-dashoffset:600;animation:spk 1.1s var(--ease) forwards}
@keyframes spk{to{stroke-dashoffset:0}}

/* bait bar (Farm option 5) */
.kpi .left{position:absolute;right:18px;top:38px;display:grid;justify-items:end;gap:2px}
.kpi .left b{font:600 22px/1.1 var(--sans);letter-spacing:-.02em}
.kpi .left span{font-size:11.5px;color:var(--text-3)}
.segs{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;margin-top:12px}
.segs i{height:9px;border-radius:3px;background:var(--border);transition:background-color .5s var(--ease),transform .5s var(--spring)}
.segs i.on{background:var(--accent)}
.segs.low i.on{background:var(--warn)}
.kpi:hover .segs i.on{transform:scaleY(1.25)}

/* rarity columns (Farm option 9) */
.rcols{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;height:132px;align-items:end;margin:4px 0 16px}
.rcol{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.rcol b{font:600 13px var(--mono);color:var(--rc);margin-bottom:5px}
.rcol .bar{width:100%;border-radius:9px 9px 4px 4px;background:linear-gradient(180deg,var(--rc),color-mix(in srgb,var(--rc) 55%,transparent));transition:height .9s var(--spring)}
.rcol .bar.imp{background:linear-gradient(180deg,#ff9a3c,var(--impossible))}
.rcol small{margin-top:7px;font-size:11.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rcol.zero b{color:var(--text-3)} .rcol.zero .bar{background:var(--border)}
.rcol.hit .bar{animation:hitfill .8s var(--spring)}

/* Items map (option 4) */
.tm-wrap{padding:16px;display:grid;gap:14px}
.tm-head .pill{border-color:var(--border);background:var(--raised)}
.itlist{display:none}.tm-wrap.list .itlist{display:block}.tm-wrap.list .tm,.tm-wrap.list .legend{display:none}
.tm-head{display:flex;align-items:center;gap:10px;padding:2px 4px 0}
.tm-head h2{margin:0;font:600 16px var(--sans);display:flex;align-items:center;gap:8px}
.tm-head h2 svg{color:var(--text-3)}
.tm-head .sp{flex:1}
.tm{position:relative;height:610px}
.cell{position:absolute;border-radius:14px;padding:12px 14px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;
  background:color-mix(in srgb,var(--rc) 15%,var(--surface));border:1px solid color-mix(in srgb,var(--rc) 32%,transparent);
  animation:tmpop .7s var(--spring) both;transition:transform .4s var(--spring),background-color .2s}
.cell:hover{transform:scale(1.02);background:color-mix(in srgb,var(--rc) 22%,var(--surface));z-index:2}
.cell.imp{background:linear-gradient(135deg,color-mix(in srgb,var(--impossible) 26%,var(--surface)),color-mix(in srgb,#ff9a3c 22%,var(--surface)));border-color:color-mix(in srgb,#ff7a6a 45%,transparent)}
@keyframes tmpop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.cell .n{font:500 13px/1.25 var(--sans);color:var(--text-1)}
.cell .t{font:650 10.5px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--rc);margin-bottom:4px}
.cell .q{font:600 30px/1 var(--sans);letter-spacing:-.02em}
.cell .m{font:400 12px var(--mono);color:var(--text-2);display:flex;gap:10px}
.cell.s .q{font-size:22px}.cell.xs .q{font-size:18px}.cell.xs .m span+span{display:none}
.legend{display:flex;gap:8px;flex-wrap:wrap;padding:0 4px}
.legend>span{display:inline-flex;align-items:center;gap:8px;padding:5px 11px 5px 6px;border-radius:999px;background:var(--raised);border:1px solid var(--border);font-size:12.5px;color:var(--text-2)}
.legend i{width:18px;height:10px;border-radius:4px;background:var(--rc)}
.legend i.imp{background:linear-gradient(90deg,var(--impossible),#ff9a3c)}
.legend b{font:500 12.5px var(--mono);color:var(--text-1)}
.legend>.note{margin-left:auto;background:transparent;border:0;color:var(--text-3)}
/* Items list (option 7) */
.itb{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.itb .sp{flex:1}
.isearch{display:flex;align-items:center;gap:8px;height:38px;padding:0 13px;border-radius:12px;background:var(--raised);border:1px solid var(--border);color:var(--text-3);width:210px}
.isearch input{all:unset;flex:1;min-width:0;font:13px var(--sans);color:var(--text-1)}
.isearch:focus-within{border-color:var(--border-strong)}
.ichips{display:flex;gap:6px;flex-wrap:wrap}
.ichip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--raised);font:500 12.5px var(--sans);color:var(--text-2);cursor:pointer;transition:transform .35s var(--spring),border-color .15s,background-color .15s}
.ichip:hover{transform:translateY(-2px)}
.ichip b{font:500 12px var(--mono);color:var(--rc)}
.ichip.on{border-color:color-mix(in srgb,var(--rc) 45%,transparent);background:color-mix(in srgb,var(--rc) 12%,var(--raised));color:var(--text-1)}
.itbl{border:1px solid var(--border);border-radius:16px;overflow:hidden}
.itbl table{width:100%;border-collapse:collapse}
.itbl th{font:500 11.5px var(--sans);color:var(--text-3);text-align:right;padding:12px 16px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.itbl th:first-child,.itbl th:nth-child(2){text-align:left}
.itbl td{padding:0 16px;height:42px;border-bottom:1px solid var(--border);text-align:right;font:500 13.5px var(--mono);white-space:nowrap}
.itbl tr:last-child td{border-bottom:0}
.itbl td.n{text-align:left;font:500 13.5px var(--sans);position:relative;padding-left:22px}
.itbl td.n::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--rc)}
.itbl tr.imp td.n::before{background:linear-gradient(var(--impossible),#ff9a3c)}
.itbl td.t{text-align:left}
.itbl td.s svg{display:block;margin-left:auto}
.itbl tbody tr{transition:background-color .2s}
.itbl tbody tr:hover{background:var(--raised)}
.itbl tr.sep td{border-top:1px solid var(--border-strong)}
.itbl .ish{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
.itbl .ish em{font-style:normal;min-width:48px;text-align:right}
.itbl .ish i{display:block;flex:none;width:64px;height:5px;border-radius:9px;background:var(--border);overflow:hidden}
.itbl .ish i b{display:block;height:100%;background:var(--rc)}
.itbl .new{font:600 10px/1 var(--sans);color:var(--legendary);background:color-mix(in srgb,var(--legendary) 14%,transparent);border-radius:999px;padding:3px 7px;margin-left:8px;vertical-align:1px;letter-spacing:.03em}
.itbl td.empty{text-align:center;height:120px;color:var(--text-3)}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="page">
  <div class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg class="i" style="color:var(--bg)"><use href="#i-rod"/></svg></div>
      <div><h1>Autofish</h1><p id="sub">Project Slayers 2</p></div>
    </div>
    <nav class="seg tabs" id="tabs" role="tablist" aria-label="Sections">
      <button data-view="farm" aria-pressed="true"><svg class="i"><use href="#i-rod"/></svg>Farm</button>
      <button data-view="lab" aria-pressed="false"><svg class="i"><use href="#i-lab"/></svg>Rod Lab</button>
      <button data-view="items" aria-pressed="false"><svg class="i"><use href="#i-box"/></svg>Items</button>
      <button data-view="log" aria-pressed="false"><svg class="i"><use href="#i-list"/></svg>Log</button>
      <button data-view="settings" aria-pressed="false" aria-label="Settings" title="Settings"><svg class="i"><use href="#i-sliders"/></svg></button>
    </nav>
    <button class="theme" id="theme" aria-label="Light or dark" title="Light or dark"><svg class="i"><use href="#i-moon"/></svg></button>
  </div>

  <!-- Farm -->
  <section class="view on" id="v-farm">

      <div class="state">
        <div class="sico" id="sico" aria-hidden="true"></div>
        <div style="min-width:0">
          <h2 id="state">Loading</h2>
          <p id="meta"></p>
          <div class="reason" id="reason"></div>
        </div>
      </div>
      <div class="ctl">
        <div class="timer" id="timer" title="Time farmed this session"><span class="tl2"><svg class="i"><use href="#i-clock"/></svg>Session</span><b class="num" id="tClock">00:00<i>:00</i></b></div>
        <div class="btns">
          <button class="btn primary" id="bStart"><svg class="i"><use href="#i-play"/></svg>Start</button>
          <button class="btn primary" id="bResume"><svg class="i"><use href="#i-play"/></svg>Continue</button>
          <button class="btn" id="bPause"><svg class="i"><use href="#i-pause"/></svg>Pause</button>
          <button class="btn danger" id="bStop" aria-label="Stop" title="Stop"><svg class="i"><use href="#i-stop"/></svg></button>
        </div>
      </div>
      <div class="deck" id="deck" role="radiogroup" aria-label="Mode"></div>
      <div class="checks" id="checks"></div>
    </article>

    <section class="kpis" id="kpis"></section>

    <section class="grid">
      <article class="card">

      <article class="card">
        <header><h3><svg class="i"><use href="#i-list"/></svg>Activity</h3></header>

      </article>
    </section>
    <article class="card">

      <div class="body"><div class="tl" id="timeline"></div></div>
    </article>
  </section>

  <!-- Items -->

      <div class="tm-head"><h2><svg class="i"><use href="#i-box"/></svg>Items</h2><span class="pill"><b id="itemsCount">0</b></span><span class="pill" id="itemsRate"></span><span class="sp"></span>
        <div class="seg" id="itemsView" role="group" aria-label="View"></div></div>

  <!-- Settings -->
  <section class="view" id="v-settings">
    <section class="cols3">
      <article class="card">
        <div class="sh"><span class="ic"><svg class="i"><use href="#i-user"/></svg></span><div><h3>Account</h3><small class="mono" id="sWho"></small></div></div>
        <div class="body sform">
          <label class="fl" title="Your Roblox username, not your display name"><span class="flab">Username</span>
            <input class="input" id="sUser" autocomplete="off" spellcheck="false" placeholder="Roblox username"></label>
          <div class="fl" title="Set Spawn Anywhere: Full farmer can rejoin and walk back by itself"><span class="flab">Spawn gamepass</span><div class="seg onoff" data-key="spawn_gamepass" role="group" aria-label="Spawn gamepass"></div></div>
          <div class="tools">
            <button class="tool" id="bTerm" title="Discord, hotkeys and every other setting"><span class="ic"><svg class="i"><use href="#i-term"/></svg></span><b>Terminal</b></button>
            <button class="tool" id="bData" title="Logs, stats and screenshots"><span class="ic"><svg class="i"><use href="#i-folder"/></svg></span><b>Data folder</b></button>
          </div>
        </div>
      </article>
      <article class="card">
        <div class="sh"><span class="ic"><svg class="i"><use href="#i-rod"/></svg></span><div><h3>Rod</h3><small class="mono" id="sRodSum"></small></div></div>
        <div class="body sform">
          <div class="fl" title="The rod you fish with; Rod Lab keeps stats per rod"><span class="flab">Rod</span><div class="rods" id="sRod" role="radiogroup" aria-label="Rod"></div></div>
          <div class="fl" title="The number key your rod is on"><span class="flab">Rod slot</span><div class="slots" id="sSlot" role="radiogroup" aria-label="Rod slot"></div></div>
          <div class="fl" title="Press Capture, then hover over the water within 4 seconds"><span class="flab">Cast point</span>
            <div class="castrow"><span class="castv mono num"><svg class="i"><use href="#i-target"/></svg><span id="sCast"></span></span><button class="btn" id="bCast"><svg class="i"><use href="#i-pointer"/></svg>Capture</button></div></div>
        </div>
      </article>
      <article class="card">

</div>

<script>
const BOOT = /*BOOT*/;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ico = (name, cls='') => `<svg class="i ${cls}"><use href="#i-${name}"/></svg>`;
// Least to most automatic, left to right.
const MODES = [
  {k:'assist', name:'Minigame', icon:'pad', c:'var(--common)', line:'You cast and collect. It wins the minigame.', does:['reel']},
  {k:'spot', name:'Fish here', icon:'target', c:'var(--uncommon)', line:'You aim. It clicks, reels and collects.', does:['reel','cast','collect']},

/* --- server --- */

/* --- tween numbers so live values glide instead of jumping --- */

let tBase = {at: 0, secs: 0, live: false};

}

function drawKpis(s){

    ['gold', 'coins', 'Gold / h', s.gold_per_hour, v => `${fmt(v/1000,1)}<small>k</small>`, s.gold_per_hour && s.active_seconds ? `≈ ${fmt(s.gold_per_hour*s.active_seconds/3600/1000,1)}k this session` : ''],

// Pace comes from catches in the event feed (5-minute buckets over the last hour);

let goldHist = []; try { goldHist = JSON.parse(localStorage.getItem('autofish-gold') || '[]'); } catch (e) {}

    <path class="ar" style="fill:url(#g-sp-${id})" d="${d} L${W} ${H} L0 ${H} Z"/><path class="ln" d="${d}"/><circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="3"/></svg>`;
}

    if (!last || now - last[0] >= 60) { goldHist.push([now, s.gold_per_hour]); goldHist = goldHist.filter(g => now - g[0] < 3600).slice(-60); try { localStorage.setItem('autofish-gold', JSON.stringify(goldHist)); } catch (e) {} } }

const ITEM_RARITY = BOOT.rarity || {};

let lastCounts2 = null;
function drawCatch(s){
  const rows = (s.items || []).map(r => ({...r, rarity: r.rarity || rarityOf(r.item)})).filter(r => r.quantity > 0 && r.rarity)
    .sort((a, b) => RORDER.indexOf(a.rarity) - RORDER.indexOf(b.rarity) || b.quantity - a.quantity);

  if (!rows.length) { box.innerHTML = `<div class="empty">${ico('fish', 'big')}</div>`; box._built = false; return; }
  const by = {}; rows.forEach(r => by[r.rarity] = (by[r.rarity] || 0) + r.quantity);
  const tiers = RORDER.filter(r => by[r]), hours = Math.max(.1, (s.active_seconds || 0)/3600);
  if (!box._built) { box._built = true;
    box.innerHTML = `<div class="rcols" id="mixbar">${RORDER.map(r => `<div class="rcol" data-r="${r}" style="--rc:${RVAR[r]}"><b class="num">0</b><span class="bar${r === 'Impossible' ? ' imp' : ''}"></span><small>${r}</small></div>`).join('')}</div><div class="ctbl"><table><thead><tr><th>Item</th><th>Rarity</th><th>Count</th><th>/ h</th></tr></thead><tbody id="ctb"></tbody></table></div>`; }
  // Rarity columns (Farm option 9): log height so one Impossible still shows next to 400 commons.
  const bar = $('mixbar'), top = Math.log1p(Math.max(...Object.values(by)));
  bar.querySelectorAll('.rcol').forEach(c => { const n = by[c.dataset.r] || 0;
    c.classList.toggle('zero', !n); c.querySelector('b').textContent = fmt(n); c.title = `${c.dataset.r}: ${fmt(n)}`;
    c.querySelector('.bar').style.height = (n ? 8 + 80*Math.log1p(n)/top : 3) + 'px'; });
  const hits = new Set(); if (lastCounts2) rows.forEach(r => { if ((lastCounts2[r.item] || 0) < r.quantity) hits.add(r.item); });
  $('ctb').innerHTML = rows.map(r => `<tr class="${hits.has(r.item) ? 'hit' : ''}" style="--rc:${RVAR[r.rarity]}"><td class="n">${esc(r.item)}</td><td><span class="rtag" style="--rc:${RVAR[r.rarity]}">${r.rarity}</span></td>
    <td class="q num">${fmt(r.quantity)}</td><td class="ph num">${fmt(r.quantity/hours, r.quantity/hours < 10 ? 1 : 0)}</td></tr>`).join('');
  hits.forEach(name => { const r = rows.find(x => x.item === name); const seg = bar.querySelector(`[data-r="${r.rarity}"]`); if (seg) { seg.classList.remove('hit'); void seg.offsetWidth; seg.classList.add('hit'); }
    if (RORDER.indexOf(r.rarity) <= 2 && seg) burst(seg, RVAR[r.rarity]); });

}
function burst(el, color){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  for (let i = 0; i < 14; i++) { const d = document.createElement('i'); d.className = 'burst'; d.style.background = color; d.style.left = x + 'px'; d.style.top = y + 'px'; document.body.appendChild(d);
    const a = Math.random()*Math.PI*2, dist = 24 + Math.random()*40;
    d.animate([{transform:'translate(0,0) rotate(0)', opacity:1}, {transform:`translate(${Math.cos(a)*dist}px,${Math.sin(a)*dist}px) rotate(${Math.random()*300}deg)`, opacity:0}], {duration:700 + Math.random()*300, easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish = () => d.remove(); }
}
function evIcon(e){

  if (e.group === 'catches') return ['catch', 'fish'];
  if (e.group === 'recovery') return ['rec', 'refresh'];
  if (e.group === 'state') return ['state', /pause/i.test(e.text) ? 'pause' : /stop/i.test(e.text) ? 'stop' : 'play'];
  return ['', 'list'];
}
function feedHtml(list){
  return list.map(e => { const key = e.id ?? (e.at + e.text), fresh = seen.size && !seen.has(key); seen.add(key);
    const [cls] = evIcon(e), rar = e.group === 'catches' ? rarityOf(e.text) : null, rare = rar && RORDER.indexOf(rar) <= 3;
    return `<div class="ev ${cls}${rare ? ' rar' : ''}${fresh ? ' fresh' : ''}"${rare ? ` style="--rc:${RVAR[rar]}"` : ''}><time>${clock(e.at)}</time><span title="${esc(e.text)}">${esc(e.text)}</span></div>`; }).join('');
}
function drawFeed(s){
  const ev = (s.events || []).slice().reverse();
  $('feed').innerHTML = ev.length ? feedHtml(ev.slice(0, 40)) : `<div class="empty">${ico('list', 'big')}</div>`;
}
/* Status chips: an icon and a word or two; the full meaning is in the tooltip. */
const CHECKS = {
  'Roblox': ['pad', v => /^Not polled|^Checking|^Unknown/.test(v) ? 'Roblox' : v],
  'Account': ['user', v => v === 'Not set' ? 'No username' : v],
  'Spawn gamepass': ['ticket', v => v === 'Yes' ? 'Gamepass' : v === 'No' ? 'No gamepass' : 'Gamepass?'],
  'Rod slot': ['keys', v => 'Slot ' + v],
  'Overnight': ['moon', v => v === 'On' ? 'Overnight' : 'Overnight off'],
  'Bait': ['hook', v => v.replace(' left', '')],
  'Unread items': ['alert', v => v + ' unread'],
};
function drawChecks(s){

    return `<span class="pill ${c.ok === true ? 'ok' : c.ok === false ? 'bad' : c.ok === 'warn' ? 'warn' : ''}" title="${esc(c.label)}: ${esc(c.value)}">${ico(i)}${esc(short(String(c.value)))}</span>`; }).join('');

/* --- other views --- */
function drawItems(s){

  $('itemsCount').textContent = fmt(total);
  const hours = (s.active_seconds || 0)/3600; $('itemsRate').innerHTML = hours > .05 ? `${ico('gauge')}<b class="num">${fmt(total/hours)}</b>/h` : ''; $('itemsRate').hidden = !(hours > .05);
  segHtml($('itemsView'), [['map', 'Map'], ['list', 'List']].map(([k, l]) => `<button data-k="${k}" aria-pressed="${k === itemsView}">${l}</button>`).join(''));

// Items map (Items option 4): area follows count, rare items enlarged so one Refinement Guard stays readable.
let itemsView = 'map'; try { itemsView = localStorage.getItem('autofish-items-view') || 'map'; } catch (e) {}
function squarify(items, x, y, w, h){

    if (rc.w >= rc.h) { const cw = s/rc.h; let yy = rc.y; row.forEach(r => { const ch = r.v/cw; out.push({...r, x: rc.x, y: yy, w: cw, h: ch}); yy += ch; }); return {x: rc.x + cw, y: rc.y, w: rc.w - cw, h: rc.h}; }

$('iChips').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (b) { itemTier = b.dataset.t; drawItems(S); } });
$('iSearch').addEventListener('input', () => S && drawItems(S));
$('iCsv').addEventListener('click', () => { const rows = (S.items || []).filter(r => r.quantity > 0).map(r => `"${r.item.replace(/"/g, '""')}",${r.rarity || rarityOf(r.item) || ''},${r.quantity}`);
  navigator.clipboard?.writeText(['Item,Rarity,Quantity', ...rows].join('\n')); toast('Copied as CSV'); });
$('itemsView').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (!b) return; itemsView = b.dataset.k; try { localStorage.setItem('autofish-items-view', itemsView); } catch (x) {} $('tm')._k = null; drawItems(S); });
$('sHook').addEventListener('change', e => { const v = e.target.value.trim(); if (v) setting('webhook', v); e.target.value = ''; });
$('sRod').addEventListener('click', e => { const b = e.target.closest('[data-rod]'); if (b) setting('rod', b.dataset.rod); });
$('sSlot').addEventListener('click', e => { const b = e.target.closest('[data-slot]'); if (b) { $('sSlot').querySelectorAll('.key').forEach(x => x.classList.toggle('on', x === b)); setting('rod_slot', +b.dataset.slot); } });
$('sheet').addEventListener('click', e => {
  const st = OB_STEPS[OB.i];
  const o = e.target.closest('[data-o]'); if (o) { o.classList.add('done-burst'); return setTimeout(() => obAnswer(st.opts[+o.dataset.o].v), 180); }
  const k = e.target.closest('[data-key]'); if (k) { $('sheet').querySelectorAll('.key').forEach(x => x.classList.toggle('on', x === k)); return setTimeout(() => obAnswer(+k.dataset.key), 300); }
  if (e.target.closest('#obBack')) { OB.i = Math.max(0, OB.i - 1); return obShow(); }
  if (e.target.closest('#obSkip')) { OB.i++; return obShow(); }
  if (e.target.closest('#obNext')) { const v = $('obIn').value.trim(); if (v) obAnswer(v); else { OB.i++; obShow(); } return; }
  if (e.target.closest('#obCap')) { const ring = $('cring'); ring.classList.add('go'); act({action:'capture_cast'});
    let n = 4; ring.firstChild.outerHTML; const tickDown = () => { if (n === 0) { ring.innerHTML = ico('check'); toast('Cast point saved'); return setTimeout(() => { OB.i++; obShow(); }, 700); }
      ring.querySelector('.i') && ring.querySelector('.i').remove(); ring.querySelector('b')?.remove(); ring.insertAdjacentHTML('afterbegin', `<b>${n}</b>`); n--; setTimeout(tickDown, 1000); }; tickDown(); return; }
  if (e.target.closest('#obFinish')) { OB.active = false; OB.done = true; $('veil').classList.remove('on'); draw(S);
    const rec = document.querySelector('#deck .mc.rec'); if (rec) { pickMode = rec.dataset.m; draw(S); burst(rec, 'var(--accent)'); } }
});
$('sheet').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'obIn') $('obNext').click(); });

async function poll(){ try { draw(await api('/api/state')); } catch (e) { $('foot').textContent = 'Reconnecting…'; } }
show(BOOT.view || 'farm'); addEventListener('resize', () => document.querySelectorAll('.seg').forEach(s => s.querySelector('.glide') && glide(s)));
poll(); if (!BOOT.sample) setInterval(poll, 2000);
</script>
</body>
</html>
