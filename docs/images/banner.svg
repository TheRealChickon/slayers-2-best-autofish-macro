<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Autofish: hands-free fishing for Slayers 2 on Roblox">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1424"/>
      <stop offset="1" stop-color="#12304a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b6f8f"/>
      <stop offset="1" stop-color="#0a2b40"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6d58a"/>
      <stop offset="1" stop-color="#e3a64a"/>
    </linearGradient>
    <radialGradient id="moon" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset=".6" stop-color="#ffe9a8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="360" rx="18" fill="url(#sky)"/>
  <g fill="#cfe3ff" opacity=".55">
    <circle cx="90" cy="48" r="1.4"/><circle cx="210" cy="96" r="1"/><circle cx="350" cy="36" r="1.2"/>
    <circle cx="470" cy="80" r="1"/><circle cx="640" cy="28" r="1.3"/><circle cx="760" cy="70" r="1"/>
    <circle cx="1180" cy="40" r="1.2"/><circle cx="1240" cy="110" r="1"/><circle cx="560" cy="120" r="1"/>
  </g>
  <circle cx="1010" cy="92" r="70" fill="url(#moon)"/>
  <circle cx="1010" cy="92" r="26" fill="#fff3cf"/>
  <!-- sea -->
  <path d="M0 238 C120 226 220 250 340 238 S560 226 680 238 900 250 1020 238 1200 226 1280 236 V360 H0 Z" fill="url(#sea)"/>
  <path d="M0 262 C140 252 250 272 380 262 S620 252 760 262 1000 272 1140 262 1240 256 1280 260" fill="none" stroke="#7fd3e6" stroke-opacity=".35" stroke-width="2"/>
  <path d="M0 296 C160 288 280 304 420 296 S700 288 840 296 1100 304 1280 294" fill="none" stroke="#7fd3e6" stroke-opacity=".2" stroke-width="2"/>
  <path d="M960 244 h100 M940 262 h60 M1050 268 h40" stroke="#fff3cf" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>
  <!-- rod and line -->
  <path d="M1270 0 Q1120 70 960 150" fill="none" stroke="#3b2a1c" stroke-width="7" stroke-linecap="round"/>
  <path d="M960 150 Q930 200 905 240" fill="none" stroke="#dfe9f2" stroke-opacity=".7" stroke-width="1.6"/>
  <g transform="translate(905 240)">
    <ellipse cx="0" cy="8" rx="26" ry="5" fill="none" stroke="#7fd3e6" stroke-opacity=".5" stroke-width="2"/>
    <circle cx="0" cy="0" r="11" fill="#f2f2f2"/>
    <path d="M-11 0 A11 11 0 0 0 11 0 Z" fill="#e2483d"/>
  </g>
  <!-- fish -->
  <g transform="translate(780 312) rotate(-8)" opacity=".85">
    <path d="M0 0 C18 -14 46 -14 62 0 C46 14 18 14 0 0 Z" fill="#f2a14a"/>
    <path d="M60 0 L80 -12 L76 0 L80 12 Z" fill="#f2a14a"/>
    <circle cx="14" cy="-2" r="2.6" fill="#0a2b40"/>
  </g>
  <g transform="translate(1120 330) rotate(6) scale(.7)" opacity=".7">
    <path d="M0 0 C18 -14 46 -14 62 0 C46 14 18 14 0 0 Z" fill="#7fd3e6"/>
    <path d="M60 0 L80 -12 L76 0 L80 12 Z" fill="#7fd3e6"/>
    <circle cx="14" cy="-2" r="2.6" fill="#0a2b40"/>
  </g>
  <!-- text -->
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="72" y="132" font-size="88" font-weight="800" fill="url(#gold)" letter-spacing="-1">Autofish</text>
    <text x="76" y="182" font-size="30" font-weight="600" fill="#e8f1f8">Hands-free fishing for Project Slayers 2 on Roblox</text>
    <text x="76" y="222" font-size="20" fill="#9fb8c9">Casts, reels, collects and recovers on its own. Free and open source for Windows.</text>
  </g>
</svg>
